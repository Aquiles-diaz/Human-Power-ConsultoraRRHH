name: Recordatorios de perfil

# Cron de los recordatorios por email (POST /tasks/profile-reminders): GitHub
# Actions hace de reloj porque el backend en Render free DUERME cuando nadie lo
# visita — un scheduler en el propio proceso (APScheduler y afines) nunca
# dispararía. El POST además lo despierta, por eso la tarea reintenta con pausa:
# el cold start de Render tarda ~1 minuto.
#
# Requiere el secret CRON_SECRET en el repo (Settings → Secrets → Actions), con
# el MISMO valor que la env var CRON_SECRET del servicio en Render. Sin ese
# secret configurado se omite la tarea y se documenta en el resumen de Actions.
# No se repiten peticiones 403 ni se generan avisos de fallo cada hora.
#
# El horario del cron es UTC; la tarea es idempotente (registra cada envío en
# profile_nudges), así que correrla de más nunca duplica mails. workflow_dispatch
# permite dispararla a mano desde la pestaña Actions (útil con ?dry_run=1 local).
on:
  schedule:
    - cron: "0 * * * *" # cada hora en punto
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verificar sin enviar correos"
        type: boolean
        default: true

permissions:
  contents: read

# Evita que una ejecución manual y el cron procesen los mismos candidatos.
concurrency:
  group: profile-reminders
  cancel-in-progress: false

jobs:
  enviar:
    name: Verificar configuración y procesar recordatorios
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar o registrar configuración pendiente
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDERS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/run-profile-reminders.py
