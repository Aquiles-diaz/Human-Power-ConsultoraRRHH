# Blueprint de Render para el backend (FastAPI).
# Crear el servicio desde el dashboard: New + → Blueprint → este repo.
# Los secretos (sync: false) se pegan a mano al crear el servicio.
services:
  - type: web
    name: human-power-api
    runtime: python
    plan: free
    region: virginia # misma costa que la DB de Supabase (aws-1-us-east-1)
    buildCommand: pip install -r requirements.txt
    # --proxy-headers + --forwarded-allow-ips: en Render el único hop frente a la
    # app es su proxy de borde, así que uvicorn puede derivar la IP real del
    # cliente desde X-Forwarded-For (necesario para que el rate limiting por IP
    # funcione de verdad y no agrupe a todos bajo la IP del proxy).
    # NOTA anti-spoofing: el rate limiter NO confía en la 1ª IP del XFF (la puede
    # falsificar el cliente); usa la ÚLTIMA hop, que la agrega el proxy de Render
    # (ver client_ip_key en backend/ratelimit.py). Válido porque hay un solo hop
    # confiable; si en el futuro se agrega otro proxy/CDN al frente, revisar eso.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: RUN_INIT_DB
        value: "0" # esquema gestionado por migraciones (ya aplicado en Supabase cloud)
      - key: PG_DISABLE_PREPARE
        value: "1" # requerido por el transaction pooler de Supabase
      # Ambos orígenes durante la transición de dominio: el dominio propio (el
      # canónico) y el .vercel.app viejo (links ya compartidos, cachés, bots).
      - key: CORS_ORIGINS
        value: https://www.humanpower.com.ar,https://human-power-rrhh.vercel.app
      - key: FRONTEND_URL
        value: https://www.humanpower.com.ar
      # URL pública de ESTA API: de acá salen los links de baja que viajan por
      # mail. No lleva value fijo porque si falta, emailer.py cae en
      # RENDER_EXTERNAL_URL, que Render inyecta solo y siempre es la correcta.
      # Se carga a mano el día que la API pase a api.humanpower.com.ar.
      - key: API_PUBLIC_URL
        sync: false
      # Email transaccional. Van a mano (sync: false) y NO con un value fijo a
      # propósito: el remitente y la key de Brevo tienen que poder cambiarse sin
      # un deploy. Importa el ORDEN al migrar el dominio (docs/SETUP-dominio-brevo.md):
      # Brevo rechaza con 403 cualquier envío desde un remitente que todavía no
      # verificó, así que SMTP_FROM recién pasa a no-reply@humanpower.com.ar
      # DESPUÉS de que el panel de Brevo marque el dominio como autenticado. Al
      # revés se cae TODO el mail (reset de contraseña incluido).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false # hoy el gmail; tras autenticar el dominio, no-reply@humanpower.com.ar
      - key: SMTP_REPLY_TO
        sync: false # humanpower.rrhh@gmail.com — no-reply@ no recibe
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # pooler de Supabase (aws-1-us-east-1, puerto 6543)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
