<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />

    <!-- ── SEO ─────────────────────────────────────────────────────────────
         Meta base de la home. Es lo que ven los crawlers que NO ejecutan JS
         (WhatsApp, Facebook, LinkedIn, etc.). Para /ofertas/:jobId el head se
         reescribe por aviso en api/job-page.ts (mismas URLs absolutas). -->
    <title>Human Power | Consultora integral de RRHH</title>
    <meta
      name="description"
      content="Human Power, consultora integral de RRHH. Subí tu CV con un video donde te presentás y destacate entre cientos de candidatos. Ofertas de empleo y selección de talento."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Human Power" />
    <link rel="canonical" href="https://www.humanpower.com.ar/" />

    <!-- Open Graph (previews al compartir en redes / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Human Power" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Human Power | Consultora integral de RRHH" />
    <meta
      property="og:description"
      content="No somos un portal de empleo más. Cada candidato se presenta con un video junto a su CV. Mirá las ofertas y postulate online."
    />
    <meta property="og:url" content="https://www.humanpower.com.ar/" />
    <meta property="og:image" content="https://www.humanpower.com.ar/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Human Power · Consultora integral de RRHH" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Human Power | Consultora integral de RRHH" />
    <meta
      name="twitter:description"
      content="No somos un portal de empleo más. Cada candidato se presenta con un video junto a su CV. Mirá las ofertas y postulate online."
    />
    <meta name="twitter:image" content="https://www.humanpower.com.ar/og-image.png" />

    <!-- JSON-LD de la organización (SEO local / panel de marca). Estático a
         propósito: los crawlers sin JS también lo ven. EmploymentAgency es el
         subtipo de LocalBusiness que corresponde a una consultora de RRHH.
         En /ofertas/:jobId convive con el JobPosting que inyecta
         api/job-page.ts (#hp-job-ld); dos bloques ld+json son válidos. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EmploymentAgency",
        "name": "Human Power",
        "alternateName": "Human Power RRHH",
        "url": "https://www.humanpower.com.ar/",
        "logo": "https://www.humanpower.com.ar/logo.png",
        "image": "https://www.humanpower.com.ar/og-image.png",
        "description": "Consultora integral de RRHH: búsqueda y selección de talento. Cada candidato se presenta con un video junto a su CV.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rosario",
          "addressRegion": "Santa Fe",
          "addressCountry": "AR"
        },
        "areaServed": "Argentina",
        "sameAs": ["https://www.instagram.com/human.power.rrhh/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
